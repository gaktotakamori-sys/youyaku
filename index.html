<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Book AI Studio</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Import Maps for React and Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0"
      }
    }
  </script>

  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* スクロールバー非表示（UIをアプリっぽく） */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#0f111a] text-slate-200 min-h-screen selection:bg-indigo-500/30 overscroll-none">
  
  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- Application Code -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Plus, BookOpen, Video, Image as ImageIcon, Grid, Settings, 
      Check, Copy, Download, Loader2, Sparkles, UploadCloud, 
      Trash2, FileText, Layout, ChevronRight, X, Info,
      Wand2, Scissors, ImagePlus, DownloadCloud, Layers, Archive,
      FolderOpen, Share2, ArrowLeft, RefreshCw, Edit3
    } from 'lucide-react';

    // === IndexedDB Utility ===
    const DB_NAME = 'BookAIStudioDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'projects';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveProjectToDB = async (project) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const { videos, coverFile, ...projectDataToSave } = project;
        projectDataToSave.updatedAt = Date.now();
        const request = store.put(projectDataToSave);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    };

    const getProjectsFromDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => {
          resolve(request.result.sort((a, b) => b.updatedAt - a.updatedAt));
        };
        request.onerror = () => reject(request.error);
      });
    };

    const deleteProjectFromDB = async (id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    };

    // === API Utility ===
    const fetchWithRetry = async (url, payload, apiKey, retries = 4, delayMs = 5000) => {
      const finalApiKey = apiKey || "";
      const endpoint = `${url}?key=${finalApiKey}`;
      
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) {
            if (response.status === 429) {
              console.warn(`Rate limited. Retrying in ${delayMs * (i + 1)}ms...`);
              await new Promise(r => setTimeout(r, delayMs * (i + 1)));
              continue;
            }
            throw new Error(`API Error: ${response.status}`);
          }
          return await response.json();
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(r => setTimeout(r, delayMs * (i + 1)));
        }
      }
    };

    const callGeminiText = async (prompt, systemInstruction = null, mimeType = null, base64 = null, schema = null, apiKey = "") => {
      const parts = [{ text: prompt }];
      if (mimeType && base64) {
        parts.push({ inlineData: { mimeType, data: base64 } });
      }
      const payload = { contents: [{ role: 'user', parts }] };
      if (systemInstruction) {
        payload.systemInstruction = { parts: [{ text: systemInstruction }] };
      }
      if (schema) {
        payload.generationConfig = {
          responseMimeType: "application/json",
          responseSchema: schema
        };
      }
      const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent`, payload, apiKey);
      return res?.candidates?.[0]?.content?.parts?.[0]?.text;
    };

    const callGeminiImage = async (prompt, aspectRatio, apiKey = "") => {
      const payload = {
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig: {
          responseModalities: ['IMAGE'],
          imageConfig: { aspectRatio }
        }
      };
      const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent`, payload, apiKey);
      const part = res?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
      if (!part) throw new Error("画像が生成されませんでした");
      return `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
    };

    const MOCKUP_PRESETS = [
      { id: 'fire', icon: '🔥', name: '熱血・挑戦', prompt: 'Masterpiece, 8k resolution, empty dark obsidian surface in the center. Dramatic fiery sparks and glowing embers in the background, intense warm spotlight aiming at the center empty space. Perfect for placing an object. Do NOT draw any text or books.' },
      { id: 'desk', icon: '☕', name: '洗練デスク', prompt: 'Masterpiece, 8k resolution, empty natural oak wooden desk in the center. Aesthetic bokeh of a modern cafe in the background, a clean ceramic coffee cup on the side, soft morning natural window light. Perfect for placing a book. Do NOT draw any text or books.' },
      { id: 'library', icon: '🏛️', name: '重厚な書斎', prompt: 'Masterpiece, 8k resolution, empty polished dark mahogany table in the center. Out-of-focus classical dark academia library shelves with vintage books and a subtle warm incandescent reading lamp in the background. Perfect for placing an object. Do NOT draw any text or books.' },
      { id: 'cyber', icon: '🌌', name: '近未来', prompt: 'Masterpiece, 8k resolution, empty reflective dark glass surface in the center. Ambient cyberpunk lighting with subtle neon cyan and violet backlighting, microscopic holographic particles floating softly. Perfect for placing an object. Do NOT draw any text or books.' }
    ];

    const createEmptyProject = () => ({
      id: Date.now().toString(),
      coverFile: null,
      coverBase64: null,
      coverMimeType: null,
      videos: [],
      themeId: 'desk',
      title: '',
      summary: [],
      ocrData: [],
      diagrams: new Array(9).fill(null),
      mockupImage: null,
      slices: [],
      createdAt: Date.now()
    });

    // === Main App Component ===
    function App() {
      const [apiKey, setApiKey] = useState('');
      const [showSettings, setShowSettings] = useState(false);
      const [toast, setToast] = useState({ visible: false, message: '', type: 'success' });
      const [viewState, setViewState] = useState('home');
      
      const [savedProjects, setSavedProjects] = useState([]);
      const [project, setProject] = useState(createEmptyProject());
      const [progress, setProgress] = useState({ stepIndex: 0, message: '', detail: '' });

      useEffect(() => {
        loadProjects();
        // Load API Key from localStorage
        const storedKey = localStorage.getItem('gemini_api_key');
        if (storedKey) setApiKey(storedKey);
      }, []);

      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('gemini_api_key', key);
      };

      const loadProjects = async () => {
        try {
          const projs = await getProjectsFromDB();
          setSavedProjects(projs);
        } catch (e) {
          console.error("DB Load Error", e);
        }
      };

      const showToast = (message, type = 'success') => {
        setToast({ visible: true, message, type });
        setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 4000);
      };

      // === データ引き継ぎ (エクスポート) ===
      const handleExportData = async () => {
        try {
          const projs = await getProjectsFromDB();
          if (projs.length === 0) return showToast('エクスポートするデータがありません', 'error');
          
          const dataStr = JSON.stringify(projs);
          const dataBlob = new Blob([dataStr], { type: 'application/json' });
          const url = URL.createObjectURL(dataBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `book_ai_studio_backup_${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('データをエクスポートしました');
        } catch (e) {
          console.error(e);
          showToast('エクスポートに失敗しました', 'error');
        }
      };

      // === データ引き継ぎ (インポート) ===
      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!Array.isArray(data)) throw new Error('無効なデータ形式です');
            
            // 全プロジェクトを保存 (復元)
            for (const proj of data) {
              await saveProjectToDB(proj);
            }
            await loadProjects();
            showToast(`${data.length}件のプロジェクトをインポートしました！`);
            setShowSettings(false); // 設定メニューを閉じる
          } catch (err) {
            console.error(err);
            showToast('インポートに失敗しました。ファイルが正しくありません。', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = ''; // ファイル入力をリセット
      };

      const handleCoverUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setProject(prev => ({
            ...prev,
            coverFile: file,
            coverBase64: ev.target.result.split(',')[1],
            coverMimeType: file.type
          }));
        };
        reader.readAsDataURL(file);
      };

      const handleVideoUpload = (e) => {
        const selected = Array.from(e.target.files).filter(f => f.type.startsWith('video/'));
        if (selected.length > 0) {
          setProject(prev => ({ ...prev, videos: [...prev.videos, ...selected] }));
        }
      };

      const removeVideo = (idx) => {
        setProject(prev => ({ ...prev, videos: prev.videos.filter((_, i) => i !== idx) }));
      };

      const extractVideoFrames = (file, fIdx, total, onProgress) => {
        return new Promise((resolve, reject) => {
          const video = document.createElement('video');
          video.src = URL.createObjectURL(file);
          video.muted = true;
          video.playsInline = true;
          
          video.onloadedmetadata = async () => {
            const duration = video.duration;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 640;
            canvas.height = 360;
            
            const samplePointsCount = 5; 
            const frames = [];
            
            for (let i = 0; i < samplePointsCount; i++) {
              const time = (duration / (samplePointsCount + 1)) * (i + 1);
              onProgress(`動画 ${fIdx+1}/${total} - フレーム解析中 (${i+1}/${samplePointsCount})`);
              
              await new Promise((res) => {
                video.currentTime = time;
                video.onseeked = res;
              });
              
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
              frames.push({ base64, time, index: i+1 });
            }
            resolve(frames);
          };
          video.onerror = () => reject(new Error('動画の読み込みに失敗しました'));
        });
      };

      const createHybridMockup = async (bgDataUrl, coverBase64, coverMime) => {
        return new Promise((resolve) => {
          const canvas = document.createElement('canvas');
          canvas.width = 1518; 
          canvas.height = 2024;
          const ctx = canvas.getContext('2d');

          const bgImg = new Image();
          bgImg.crossOrigin = "anonymous";
          bgImg.onload = () => {
            const scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
            const w = bgImg.width * scale;
            const h = bgImg.height * scale;
            const x = (canvas.width - w) / 2;
            const y = (canvas.height - h) / 2;
            ctx.drawImage(bgImg, x, y, w, h);

            const coverImg = new Image();
            coverImg.crossOrigin = "anonymous";
            coverImg.onload = () => {
              const bookH = canvas.height * 0.60;
              const bookW = bookH * (coverImg.width / coverImg.height);
              const bx = (canvas.width - bookW) / 2;
              const by = (canvas.height - bookH) / 2;

              ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
              ctx.shadowBlur = 50;
              ctx.shadowOffsetX = -20;
              ctx.shadowOffsetY = 25;

              const thickness = 40;
              ctx.fillStyle = '#e8e8e8';
              ctx.fillRect(bx - thickness, by + 12, thickness, bookH - 24);
              ctx.shadowColor = 'transparent'; 

              ctx.beginPath();
              ctx.moveTo(bx - thickness, by + 12);
              ctx.lineTo(bx, by);
              ctx.lineTo(bx, by + bookH);
              ctx.lineTo(bx - thickness, by + bookH - 12);
              ctx.fillStyle = '#d4d4d4';
              ctx.fill();

              ctx.drawImage(coverImg, bx, by, bookW, bookH);

              const gradient = ctx.createLinearGradient(bx, by, bx + bookW, by + bookH);
              gradient.addColorStop(0, 'rgba(255,255,255,0.3)');
              gradient.addColorStop(0.2, 'rgba(255,255,255,0)');
              gradient.addColorStop(0.8, 'rgba(0,0,0,0)');
              gradient.addColorStop(1, 'rgba(0,0,0,0.2)');
              ctx.fillStyle = gradient;
              ctx.fillRect(bx, by, bookW, bookH);

              resolve(canvas.toDataURL('image/jpeg', 0.95));
            };
            coverImg.src = `data:${coverMime};base64,${coverBase64}`;
          };
          bgImg.src = bgDataUrl;
        });
      };

      const compositeDiagramWithCover = async (diagramBase64, coverBase64, coverMime) => {
        return new Promise((resolve) => {
          const canvas = document.createElement('canvas');
          canvas.width = 1080;
          canvas.height = 1920;
          const ctx = canvas.getContext('2d');

          const bgImg = new Image();
          bgImg.crossOrigin = "anonymous";
          bgImg.onload = () => {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

            if (!coverBase64) {
              resolve(canvas.toDataURL('image/jpeg', 0.95));
              return;
            }

            const coverImg = new Image();
            coverImg.crossOrigin = "anonymous";
            coverImg.onload = () => {
              const bookW = 260;
              const bookH = bookW * (coverImg.height / coverImg.width);
              const padding = 60;
              const bx = canvas.width - bookW - padding;
              const by = padding;

              ctx.shadowColor = 'rgba(0,0,0,0.3)';
              ctx.shadowBlur = 20;
              ctx.shadowOffsetY = 10;
              
              ctx.fillStyle = 'white';
              const border = 8;
              ctx.fillRect(bx - border, by - border, bookW + border*2, bookH + border*2);
              
              ctx.shadowColor = 'transparent';
              ctx.drawImage(coverImg, bx, by, bookW, bookH);

              resolve(canvas.toDataURL('image/jpeg', 0.95));
            };
            coverImg.src = `data:${coverMime};base64,${coverBase64}`;
          };
          bgImg.src = diagramBase64;
        });
      };

      const sliceWithBleedCorrection = async (mockupDataUrl) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const results = [];
            const tileW = img.width / 3;
            const tileH = img.height / 3;

            const feedW = 1080;
            const feedH = 1350;
            const innerW = 1012;
            const innerH = 1350;
            const marginX = (feedW - innerW) / 2; 

            const canvas = document.createElement('canvas');
            canvas.width = feedW;
            canvas.height = feedH;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            for (let r = 0; r < 3; r++) {
              for (let c = 0; c < 3; c++) {
                const naturalIndex = r * 3 + c; 
                const postOrder = 9 - naturalIndex; 
                
                ctx.clearRect(0, 0, feedW, feedH);

                const srcX = c * tileW;
                const srcY = r * tileH;

                ctx.drawImage(
                  img, 
                  srcX, srcY, tileW, tileH,
                  -marginX, 0, feedW + marginX * 2, feedH
                );
                ctx.filter = 'blur(8px)';
                ctx.drawImage(canvas, 0, 0);
                ctx.filter = 'none';

                ctx.drawImage(
                  img,
                  srcX, srcY, tileW, tileH,
                  marginX, 0, innerW, innerH
                );

                const simCanvas = document.createElement('canvas');
                simCanvas.width = 1080;
                simCanvas.height = 1080;
                const simCtx = simCanvas.getContext('2d');
                simCtx.drawImage(canvas, 0, (1350-1080)/2, 1080, 1080, 0, 0, 1080, 1080);

                results.push({ 
                  postOrder, 
                  dataUrl: canvas.toDataURL('image/jpeg', 0.95), 
                  simUrl: simCanvas.toDataURL('image/jpeg', 0.8) 
                });
              }
            }
            resolve(results.sort((a, b) => a.postOrder - b.postOrder));
          };
          img.onerror = () => reject(new Error('分割に失敗しました'));
          img.src = mockupDataUrl;
        });
      };

      const runFullProcess = async () => {
        if (!project.coverBase64) return showToast('本の表紙画像をセットしてください', 'error');
        if (project.videos.length === 0) return showToast('動画ファイルをセットしてください', 'error');

        setViewState('processing');
        let currentProject = { ...project };
        
        try {
          setProgress({ stepIndex: 1, message: '基本情報の解析中', detail: '表紙のテキストから本のタイトルを認識しています...' });
          try {
            const titlePrompt = "この本の表紙画像から、メインの「本のタイトル」を抽出してください。出力は必ず本のタイトル名のみとし、他の文字や記号は含めないでください。";
            let extracted = await callGeminiText(titlePrompt, null, project.coverMimeType, project.coverBase64, null, apiKey);
            if(extracted) {
               currentProject.title = extracted.replace(/['"「」『』\n]/g, '').trim();
            }
          } catch (e) { 
            console.warn("Title extraction failed", e);
            currentProject.title = "無題のプロジェクト";
          }
          setProject({...currentProject});

          setProgress({ stepIndex: 1, message: '動画の解析・要約', detail: '動画フレームから内容を抽出中...' });
          let combinedOcrData = currentProject.ocrData || [];
          
          if (combinedOcrData.length === 0 && currentProject.videos.length > 0) {
            for (let fIdx = 0; fIdx < currentProject.videos.length; fIdx++) {
              const frames = await extractVideoFrames(currentProject.videos[fIdx], fIdx, currentProject.videos.length, (msg) => {
                setProgress(prev => ({ ...prev, detail: msg }));
              });
              
              let videoOcrResults = [];
              for (let i = 0; i < frames.length; i++) {
                setProgress(prev => ({ ...prev, detail: `AIが動画を読み取っています (Part${fIdx+1} - Scene${i+1}/${frames.length})` }));
                const prompt = `シーン${i+1}の画像です。画面内のスライドや本の内容を読み取り、要点を抽出してください。`;
                try {
                  const resultText = await callGeminiText(prompt, "卓越したアナリストとしてテキストを抽出してください。", 'image/jpeg', frames[i].base64, null, apiKey);
                  if(resultText) videoOcrResults.push(`[シーン${i+1}]\n${resultText}`);
                } catch(err) { console.error(err); }
              }
              combinedOcrData.push(`=== 動画 ${fIdx+1} ===\n${videoOcrResults.join('\n\n')}`);
            }
            currentProject.ocrData = combinedOcrData;
          }

          setProgress({ stepIndex: 1, message: '9章構成の要約を執筆中', detail: '指定フォーマットに従い文章を構築しています...' });
          const summarySchema = {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                chapterNumber: { type: "STRING", description: "必ず ①, ②, ③, ④, ⑤, ⑥, ⑦, ⑧, ⑨ のいずれか" },
                title: { type: "STRING", description: "見出しタイトルのみ" },
                body: { type: "STRING", description: "必ず800文字程度の要約本文。" }
              },
              propertyOrdering: ["chapterNumber", "title", "body"]
            }
          };
          const summarySysPrompt = `あなたは一流の編集者です。OCRテキストを元に、一貫した全9章構成の深く本質的な要約を作成してください。
出力は指定されたJSONスキーマに厳格に従うこと。
各章の本文(body)は800文字程度の十分な文章量で執筆してください。`;
          
          const summaryPrompt = `以下の解析データをベースにして、全9章構成の要約を作成してください。\n\n${combinedOcrData.join('\n\n')}`;
          
          const summaryResult = await callGeminiText(summaryPrompt, summarySysPrompt, null, null, summarySchema, apiKey);
          if (summaryResult) currentProject.summary = JSON.parse(summaryResult);
          else throw new Error('要約の生成に失敗しました');
          setProject({...currentProject});

          setProgress({ stepIndex: 2, message: '世界観モックアップ空間の生成', detail: 'AIが背景空間を構築しています...' });
          const preset = MOCKUP_PRESETS.find(p => p.id === currentProject.themeId);
          const bgDataUrl = await callGeminiImage(preset.prompt, "3:4", apiKey);
          
          setProgress({ stepIndex: 2, message: '元画像データの精密合成', detail: '文字崩れ防止のため、プログラムで表紙画像を直接合成中...' });
          const mockupImg = await createHybridMockup(bgDataUrl, currentProject.coverBase64, currentProject.coverMimeType);
          currentProject.mockupImage = mockupImg;
          setProject({...currentProject});

          setProgress({ stepIndex: 3, message: 'つなぎ目切れ防止処理（9分割）', detail: 'インスタ仕様(4:5)に合わせて余白を自動補正中...' });
          const slices = await sliceWithBleedCorrection(mockupImg);
          currentProject.slices = slices;
          setProject({...currentProject});

          setProgress({ stepIndex: 4, message: '図解ノートの一括生成', detail: '品質確保のため、ゆっくりと確実に1枚ずつ生成します（時間がかかります）...' });
          let currentDiagrams = new Array(9).fill(null);
          
          for (let i = 0; i < 9; i++) {
            setProgress(prev => ({ ...prev, detail: `図解生成中 (${i+1}/9枚目) - 高解像度レンダリング...` }));
            const ch = currentProject.summary[i];
            const promptText = `【最高品質・高精細】
大学生が手書きノートにまとめたような、非常に分かりやすく丁寧で美しいノート風の図解イラスト。iPhoneの縦長画面にぴったりな「縦長比率（9:16）」。
※重要：画像の「右上」の領域には後からプログラムで表紙画像を合成するため、絶対に文字や図を描かず、背景（ノートの地）のまま広く余白を空けておいてください。
文字は誤字脱字なく完璧な日本語で書くこと。
【内容（第${i+1}章）】
${ch.body}`;

            const payload = {
              contents: [{ role: 'user', parts: [{ text: promptText }] }],
              generationConfig: {
                responseModalities: ['IMAGE'],
                imageConfig: { aspectRatio: "9:16" }
              }
            };

            try {
              if (i > 0) {
                setProgress(prev => ({ ...prev, detail: `図解生成中 (${i+1}/9枚目) - サーバー負荷調整のため待機中(10秒)...` }));
                await new Promise(r => setTimeout(r, 10000));
              }
              const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent`, payload, apiKey, 5, 6000);
              const part = res?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
              if (part) {
                const baseImg = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                const composited = await compositeDiagramWithCover(baseImg, currentProject.coverBase64, currentProject.coverMimeType);
                currentDiagrams[i] = composited;
                currentProject.diagrams = [...currentDiagrams];
                setProject({...currentProject});
              }
            } catch (err) {
              console.error(`Diagram Error ch${i+1}:`, err);
            }
          }

          await saveProjectToDB(currentProject);
          await loadProjects();
          showToast('すべての生成が完了し、MY BOOKSに保存されました！');
          setViewState('result');

        } catch (err) {
          console.error(err);
          showToast('エラーが発生しました: ' + err.message, 'error');
          setViewState('setup');
        }
      };

      const handleRegenerateSummary = async () => {
        if (!project.ocrData || project.ocrData.length === 0) {
          return showToast('OCRデータがありません。動画をセットして初めから実行してください。', 'error');

        setViewState('processing');
        setProgress({ stepIndex: 1, message: '要約の再執筆', detail: '9章構成で要約を再生成中...' });
        try {
          let currentProject = { ...project };
          const summarySchema = {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                chapterNumber: { type: "STRING", description: "必ず ①, ②, ③, ④, ⑤, ⑥, ⑦, ⑧, ⑨ のいずれか" },
                title: { type: "STRING", description: "見出しタイトルのみ" },
                body: { type: "STRING", description: "必ず800文字程度の要約本文。" }
              },
              propertyOrdering: ["chapterNumber", "title", "body"]
            }
          };
          const summarySysPrompt = `あなたは一流の編集者です。OCRテキストを元に、一貫した全9章構成の深く本質的な要約を作成してください。出力は指定されたJSONスキーマに厳格に従うこと。各章の本文(body)は800文字程度の十分な文章量で執筆してください。`;
          const summaryPrompt = `以下の解析データをベースにして、全9章構成の要約を作成してください。\n\n${currentProject.ocrData.join('\n\n')}`;
          
          const summaryResult = await callGeminiText(summaryPrompt, summarySysPrompt, null, null, summarySchema, apiKey);
          if (summaryResult) {
            currentProject.summary = JSON.parse(summaryResult);
            setProject(currentProject);
            await saveProjectToDB(currentProject);
            showToast('要約を再生成しました！');
          } else {
            throw new Error('生成失敗');
          }
        } catch (e) {
          showToast('要約の再生成に失敗しました', 'error');
        } finally {
          setViewState('result');
        }
      };

      const handleRegenerateMockup = async () => {
        if (!project.coverBase64) return showToast('表紙画像がありません', 'error');
        setViewState('processing');
        setProgress({ stepIndex: 2, message: 'モックアップの再生成', detail: '新しい背景空間を構築・合成中...' });
        try {
          let currentProject = { ...project };
          const preset = MOCKUP_PRESETS.find(p => p.id === currentProject.themeId);
          const bgDataUrl = await callGeminiImage(preset.prompt, "3:4", apiKey);
          const mockupImg = await createHybridMockup(bgDataUrl, currentProject.coverBase64, currentProject.coverMimeType);
          currentProject.mockupImage = mockupImg;
          const slices = await sliceWithBleedCorrection(mockupImg);
          currentProject.slices = slices;
          
          setProject(currentProject);
          await saveProjectToDB(currentProject);
          showToast('モックアップを再生成しました！');
        } catch (e) {
          showToast('モックアップの再生成に失敗しました', 'error');
        } finally {
          setViewState('result');
        }
      };

      const handleRegenerateDiagram = async (idx) => {
        if (!project.summary || !project.summary[idx]) return;
        setViewState('processing');
        setProgress({ stepIndex: 4, message: `図解の再生成 (投稿${idx+1})`, detail: '高解像度レンダリング中...' });
        try {
          let currentProject = { ...project };

          const promptText = `【最高品質・高精細】
大学生が手書きノートにまとめたような、非常に分かりやすく丁寧で美しいノート風の図解イラスト。iPhoneの縦長画面にぴったりな「縦長比率（9:16）」。
※重要：画像の「右上」の領域には後からプログラムで表紙画像を合成するため、絶対に文字や図を描かず、背景（ノートの地）のまま広く余白を空けておいてください。
文字は誤字脱字なく完璧な日本語で書くこと。
【内容（第${idx+1}章）】
${ch.body}`;

          const payload = {
            contents: [{ role: 'user', parts: [{ text: promptText }] }],
            generationConfig: {
              responseModalities: ['IMAGE'],
              imageConfig: { aspectRatio: "9:16" }
            }
          };

          const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent`, payload, apiKey, 5, 6000);
          const part = res?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
          if (part) {
            let currentDiagrams = [...currentProject.diagrams];
            const baseImg = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
            const composited = await compositeDiagramWithCover(baseImg, currentProject.coverBase64, currentProject.coverMimeType);
            currentDiagrams[idx] = composited;
            currentProject.diagrams = currentDiagrams;
            setProject(currentProject);
            await saveProjectToDB(currentProject);
            showToast(`投稿${idx+1}の図解を再生成しました！`);
          } else {
            throw new Error('生成失敗');
          }
        } catch (e) {
          showToast(`図解の再生成に失敗しました`, 'error');
        } finally {
          setViewState('result');
        }
      };

      const handleUpdateCover = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const updatedProject = {
            ...project,
            coverFile: file,
            coverBase64: ev.target.result.split(',')[1],

          await saveProjectToDB(updatedProject);
          showToast('表紙画像を変更しました。モックアップや図解を再生成してください。');

        reader.readAsDataURL(file);

      const formatChapterForCopy = (ch) => {

      const copyToClipboard = (text, msg) => {

        showToast(msg);
      };

      const downloadImage = (dataUrl, filename) => {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = filename;
        a.click();
      };

      const downloadZip = async (items, prefix, isSlice = false) => {
        if (!window.JSZip) {
          showToast('ZIPライブラリを読み込み中です。', 'error');
          return;
        }
        showToast(`${prefix}の一括ZIP作成を開始します...`);
        try {
          const zip = new window.JSZip();
          const folder = zip.folder(prefix);
          
          let count = 0;
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item) {
              const dataUrl = isSlice ? item.dataUrl : item;
              const base64Data = dataUrl.split(',')[1];
              const indexStr = isSlice ? `part0${item.postOrder}` : `0${i+1}`;
              folder.file(`${prefix}_${indexStr}.jpg`, base64Data, { base64: true });
              count++;
            }
          }
          
          if(count === 0) return showToast('保存できるデータがありません', 'error');
          
          const content = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(content);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${project.title || 'book_studio'}_${prefix}.zip`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('ZIPファイルの保存が完了しました！');
        } catch(err) {
          showToast('ZIP作成中にエラーが発生しました', 'error');
          console.error(err);
        }
      };

            const blob2 = await (await fetch(diagramBase64)).blob();
            files.push(new File([blob2], `diagram_0${postNumber}.jpg`, { type: 'image/jpeg' }));
          }

          if (navigator.canShare && navigator.canShare({ files })) {
            await navigator.share({
              files,
              title: `投稿 ${postNumber}`,
              text: 'Instagram用に画像をシェアします。'

            showToast('シェア画面を開きました');

            showToast('画像を保存しました。Instagramを開きます...', 'info');
            setTimeout(() => { window.location.href = 'instagram://app'; }, 1500);
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error(err);
            showToast('シェアに失敗しました', 'error');
          }

      };

      return (

                <button onClick={() => {

                  <button

                  >
                    <DownloadCloud className="w-4 h-4 text-indigo-400" /> エクスポート
                  </button>
                  <label className="flex-1 py-2.5 bg-[#0f111a] hover:bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center gap-1.5 active:scale-95 transition text-xs text-slate-300 font-bold cursor-pointer">
                    <UploadCloud className="w-4 h-4 text-pink-400" /> インポート
                    <input type="file" accept=".json" className="hidden" onChange={handleImportData} />
                  </label>
                </div>
                <p className="text-[10px] text-slate-500 mt-2 leading-relaxed">
                  ※アプリをアップデートする際は、事前に「エクスポート」でJSONファイルとして保存し、新しいアプリで「インポート」して復元してください。
                </p>

                >

                </button>

                <div className="space-y-3">

                            <p className="text-[10px] text-slate-500 mt-1">{new Date(p.updatedAt).toLocaleDateString()} 更新</p>

                    <Edit3 className="w-3.5 h-3.5 text-emerald-500/50 shrink-0" />
                  </div>
                  <p className="text-[10px] text-slate-400">データはMY BOOKSに保存されました</p>
                </div>

                <div className="bg-[#161821] border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
                  <h3 className="text-xs font-bold text-slate-300 flex items-center gap-1.5 border-b border-slate-800 pb-2">
                    <Settings className="w-3.5 h-3.5" /> データ管理・再生成
                  </h3>
                  <div className="grid grid-cols-2 gap-2">
                    <label className="py-2.5 bg-[#0f111a] hover:bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center gap-1.5 active:scale-95 transition text-[10px] text-slate-300 font-bold cursor-pointer">
                      <ImagePlus className="w-3.5 h-3.5 text-blue-400" /> 表紙を変更
                      <input type="file" accept="image/*" className="hidden" onChange={handleUpdateCover} />
                    </label>
                    <button onClick={handleRegenerateSummary} className="py-2.5 bg-[#0f111a] hover:bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center gap-1.5 active:scale-95 transition text-[10px] text-slate-300 font-bold">
                      <RefreshCw className="w-3.5 h-3.5 text-indigo-400" /> 要約を再生成
                    </button>
                    <button onClick={handleRegenerateMockup} className="py-2.5 bg-[#0f111a] hover:bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center gap-1.5 active:scale-95 transition text-[10px] text-slate-300 font-bold">
                      <RefreshCw className="w-3.5 h-3.5 text-pink-400" /> 背景モック再生成
                    </button>
                    <button onClick={() => downloadZip(project.diagrams, 'diagrams', false)} className="py-2.5 bg-[#0f111a] hover:bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center gap-1.5 active:scale-95 transition text-[10px] text-slate-300 font-bold">
                      <Archive className="w-3.5 h-3.5 text-emerald-400" /> 図解をZIP保存
                    </button>
                    <button onClick={() => downloadZip(project.slices, 'mockup_tiles', true)} className="col-span-2 py-2.5 bg-[#0f111a] hover:bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center gap-1.5 active:scale-95 transition text-[10px] text-slate-300 font-bold">
                      <Archive className="w-3.5 h-3.5 text-amber-400" /> 分割モックを一括ZIP保存
                    </button>
                  </div>
                </div>

                {project.slices && project.slices.length === 9 && (
                  <div className="bg-[#161821] border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
                    <div className="flex items-center gap-2 border-b border-slate-800 pb-2">
                      <Grid className="w-4 h-4 text-pink-400" />
                      <h3 className="text-xs font-bold text-slate-200">プロフィール完成シミュレーション</h3>
                    </div>
                    
                    <div className="bg-[#0f111a] p-[1px]">
                      <div className="grid grid-cols-3 gap-[1px]">
                        {[...project.slices].sort((a, b) => b.postOrder - a.postOrder).map((slice) => (
                          <div key={slice.postOrder} className="aspect-square relative bg-slate-900 overflow-hidden active:opacity-70 transition-opacity" onClick={() => downloadImage(slice.dataUrl, `mockup_0${slice.postOrder}.jpg`)}>
                            <img src={slice.simUrl} className="absolute inset-0 w-full h-full object-cover" />
                            <div className="absolute top-1 left-1 bg-black/70 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-sm">#{slice.postOrder}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="flex items-start gap-2 bg-pink-500/10 p-2 rounded-lg border border-pink-500/20">
                      <Info className="w-3.5 h-3.5 text-pink-400 shrink-0 mt-0.5" />
                      <p className="text-[9px] text-pink-200/80 leading-relaxed">
                        自動で左右に余白を付与した<strong>4:5(フィード用)</strong>で保存されます。インスタに投稿すると左右だけが削られ<strong>絵柄が一切切れずに繋がります。</strong>画像をタップで個別保存できます。
                      </p>
                    </div>
                  </div>
                )}

                <div className="space-y-4">
                  <div className="flex items-center gap-2 border-b border-slate-800 pb-2 px-1">
                    <Layout className="w-4 h-4 text-emerald-400" /> 
                    <h3 className="text-xs font-bold text-slate-200">投稿用データ (全9回分)</h3>
                  </div>
                  <p className="text-[10px] text-slate-400 px-1">※下の <strong>投稿1</strong> から順に行ってください。</p>

                  {project.summary.map((ch, idx) => {
                    const postNumber = idx + 1; 
                    const diagramImg = project.diagrams[idx];
                    const sliceData = project.slices.find(s => s.postOrder === postNumber);

                    return (
                      <div key={idx} className="bg-[#161821] border border-slate-800 rounded-2xl overflow-hidden shadow-lg">
                        <div className="bg-slate-900/50 px-3 py-2.5 border-b border-slate-800 flex items-center justify-between">
                          <div className="font-bold text-xs text-slate-200 truncate pr-2">
                            <span className="text-pink-400 mr-2">投稿 {postNumber}</span> {ch.title}
                          </div>
                        </div>
                        
                        <div className="p-3 space-y-4">
                          <div className="grid grid-cols-2 gap-3">
                             <div className="space-y-1">
                               <span className="text-[9px] text-slate-400 font-bold block text-center">1枚目: 背景 (4:5)</span>
                               <div className="w-full aspect-[4/5] bg-[#0f111a] rounded-lg border border-slate-700 overflow-hidden relative active:opacity-70 transition-opacity" onClick={() => sliceData && downloadImage(sliceData.dataUrl, `mockup_0${postNumber}.jpg`)}>
                                  {sliceData ? <img src={sliceData.dataUrl} className="absolute inset-0 w-full h-full object-cover" /> : <div className="absolute inset-0 flex items-center justify-center"><Loader2 className="w-3 h-3 animate-spin text-slate-500"/></div>}
                               </div>
                             </div>
                             <div className="space-y-1">
                               <span className="text-[9px] text-slate-400 font-bold block text-center">2枚目: 図解 (9:16)</span>
                               <div className="w-[56.25%] mx-auto aspect-[9/16] bg-[#0f111a] rounded-lg border border-slate-700 overflow-hidden relative active:opacity-70 transition-opacity" onClick={() => diagramImg && downloadImage(diagramImg, `diagram_0${postNumber}.jpg`)}>
                                  {diagramImg ? <img src={diagramImg} className="absolute inset-0 w-full h-full object-contain" /> : <div className="absolute inset-0 flex flex-col items-center justify-center text-[8px] text-slate-500"><Loader2 className="w-3 h-3 animate-spin"/></div>}
                               </div>
                               <button 
                                 onClick={() => handleRegenerateDiagram(idx)}
                                 className="w-[56.25%] mx-auto block py-1.5 mt-1.5 bg-[#0f111a] hover:bg-slate-800 active:bg-slate-700 rounded border border-slate-700 text-[9px] text-slate-300 font-bold flex items-center justify-center gap-1 transition"
                               >
                                 <RefreshCw className="w-2.5 h-2.5" /> 図解を再生成
                               </button>
                             </div>
                          </div>

                          <div className="space-y-1.5">
                            <div className="flex items-center justify-between px-1">
                               <span className="text-[10px] font-bold text-slate-400 flex items-center gap-1"><Edit3 className="w-3 h-3"/> キャプション本文</span>
                            </div>
                            <textarea
                              className="w-full h-28 bg-[#0f111a] border border-slate-700 rounded-xl p-2.5 text-[11px] text-slate-300 focus:border-indigo-500 outline-none transition-colors resize-none leading-relaxed"
                              value={ch.body}
                              onChange={(e) => {
                                const newSummary = [...project.summary];
                                newSummary[idx] = { ...newSummary[idx], body: e.target.value };
                                setProject(prev => ({ ...prev, summary: newSummary }));
                              }}
                              onBlur={async () => await saveProjectToDB(project)}
                            />
                          </div>

                          <button 
                            onClick={() => shareToInsta(postNumber, ch, sliceData, diagramImg)}
                            className="w-full py-3 bg-gradient-to-r from-pink-600 to-orange-500 active:scale-95 text-white text-xs font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 transition-transform"
                          >
                            <Share2 className="w-4 h-4" /> キャプションコピー＆シェア
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2.5 rounded-full shadow-2xl transition-all duration-300 transform w-max max-w-[90vw] ${toast.visible ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0 pointer-events-none'} ${toast.type === 'error' ? 'bg-rose-900/95 border border-rose-500/50 text-rose-100' : 'bg-slate-800/95 border border-slate-600 text-slate-100 backdrop-blur-md'}`}>
            {toast.type === 'error' ? <Info className="w-4 h-4 text-rose-400 shrink-0" /> : <Check className="w-4 h-4 text-emerald-400 shrink-0" />}
            <p className="text-[11px] font-bold truncate">{toast.message}</p>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
